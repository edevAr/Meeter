[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-call-recorder"
version = "1.0.0"
description = "Mobile AI-powered call recorder and meeting assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Call Recorder" }]
keywords = ["recording", "transcription", "whisper", "meeting", "ai", "mobile"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Capture",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "openai>=1.55.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
whisper = [
    "openai-whisper>=20240930",
]
faster-whisper = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-call-recorder = "app.api.main:run"
ai-call-recorder-api = "app.api.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
